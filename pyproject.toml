[project]
name = "itk-attended-rpa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ITK Development", email = "itk-rpa@mkb.aarhus.dk" }
]
requires-python = ">=3.11"
dependencies = [
    "pyodbc>=5.3.0",
    "requests>=2.32.5",
]

[project.scripts]
itk-attended-rpa = "itk_attended_rpa:gui.main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pylint>=4.0.4",
]
